<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Time</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo">
            <h1 class="grad">Pixel Time</h1>
            <img class="halo" src="midori-halo.png" alt=""> <!-- A logo image that renders behind the title -->
        </div>
        <p class="tagline">Pixel perfect pictures</p>
        <form id="search-form">
            <input 
            id="search-input" 
            type="search" class="grad" 
            placeholder="Search images..." 
            spellcheck="false"
            aria-label="Enter search query"/>
            <button 
            id="search"
            type="submit" 
            aria-label="Search">🔍</button>
        </form>
        <p id="results-count">Search to see results</p> <!-- Acts as both an empty state message and results count. Two features in one label.-->
    </header>
    <main id="results">
        <!--main is the results container. There are no items yet. Image results will appear here here-->
    </main>
    <script src="script.js"></script>
</body>
</html>
